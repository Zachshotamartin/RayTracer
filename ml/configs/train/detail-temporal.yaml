seed: 42
device: auto
cpu_threads: 2
model:
  kind: guided
  width: 16
  stages: 3
  feature_schema: 2
  scale: 1
  inputs: all
  temporal: true
autoregressive_unroll: 4
validation_min_frames: 32
validation_budgets: [4, 16]
validation_first_noise_only: true
batch_size: 1
epochs: 50
patience: 10
learning_rate: 0.0003
weight_decay: 0.0001
max_seconds: 14400
temporal_loss: 0.1
loss:
  gradient: 0.25
  edge_weight: 3
  energy: 0.02
augmentation:
  flip_x: 0.5
  flip_y: 0.5
  rotate90: true
  exposure_stops: 1.5
  lighting_color_stops: 0.2
selection:
  ssim_tolerance: 0.005
  edge_ratio: 1.05
  ssim_penalty: 1
  edge_penalty: 0.05
