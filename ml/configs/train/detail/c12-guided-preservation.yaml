seed: 42
device: auto
cpu_threads: 2
model:
  kind: guided
  width: 16
  stages: 3
  scale: 1
  inputs: all
  feature_schema: 2
crop: 96
batch_size: 8
epochs: 50
patience: 10
learning_rate: 0.0003
weight_decay: 0.0001
max_seconds: 7200
validation_budgets:
- 1
- 4
- 8
- 16
- 64
validation_first_noise_only: true
selection:
  ssim_tolerance: 0.005
  edge_ratio: 1.05
  ssim_penalty: 1
  edge_penalty: 0.05
edge_sampling: 0.5
loss:
  gradient: 0.25
  edge_weight: 3
  energy: 0.02
identity_probability: 0.05
augmentation:
  flip_x: 0.5
  flip_y: 0.5
  rotate90: true
  exposure_stops: 1.5
  lighting_color_stops: 0.2
fuse_probability: 0.25
preservation_mode: measured_near_clean
near_clean_samples: 96
