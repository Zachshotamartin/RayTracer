# Full-data development baseline. Initial approval is for two epochs of this
# unchanged 50-epoch schedule, then review before continuing from latest.pt.
seed: 42
device: mps
cpu_threads: 2
model:
  kind: guided
  width: 16
  stages: 3
  scale: 1
  inputs: all
  feature_schema: 2
  guide_policy: center
crop: 96
batch_size: 8
epochs: 50
patience: 10
learning_rate: 0.0003
weight_decay: 0.0001
# Per invocation; a time-capped partial epoch is replayed on resume.
max_seconds: 7200
checkpoint_history: true
min_free_gib: 10
validation_budgets: [1, 4, 8, 16, 64]
validation_first_noise_only: true
selection:
  ssim_tolerance: 0.005
  edge_ratio: 1.05
  ssim_penalty: 1
  edge_penalty: 0.05
  hdr_ratio: 1.01
  model_hdr_ratio: 1.01
  preservation_ratio: 1.02
  min_preservation_views: 512
edge_sampling: 0.5
loss:
  gradient: 0.25
  edge_weight: 3
  energy: 0.02
identity_probability: 0.05
augmentation:
  flip_x: 0.5
  flip_y: 0.5
  rotate90: true
  exposure_stops: 1.5
  lighting_color_stops: 0.2
fuse_probability: 0.25
preservation_mode: measured_near_clean
near_clean_samples: 96
learning_diagnostics:
  warning_metric: model_region_log_mae
  stall_after_epochs: 5
  minimum_loss_reduction: 0.02
