[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raytracer-ml"
version = "0.1.0"
description = "Reproducible learned reconstruction for a CPU path tracer"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "torch>=2.6,<3", "PyYAML>=6,<7", "Pillow>=11,<13", "jsonschema>=4,<5", "filelock>=3.16,<4", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "scikit-image>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
rtml = "raytracer_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raytracer_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
